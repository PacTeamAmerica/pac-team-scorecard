name: Scorecard CI

# Gates every change to the published scorecard. Three classes of bug have
# reached the live page; each gate below exists because one of them did.
#
#  1. A one-word typo inside a component body blanked the entire page while
#     every shallow check passed (3 Aug 2026)  -> test/deeprender.js
#  2. A figure baked into a useState default went stale across two rebuilds and
#     understated Revenue YTD by $1,041,205 (19 + 25 Oct 2026)
#                                            -> test/verify_stale.py
#  3. Every booked open order was assigned to the current year, overstating the
#     2026 projection by $4.5M-$5.3M for two builds (caught 27 Oct 2026 by the
#     controller, not by this file)            -> test/verify_revtiming.py
#
# A red run means do not publish. See PAC_TEAM_Scorecard_Manual.md section 12.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'build_meta.json'
      - 'test/**'
      - '.github/workflows/scorecard-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'build_meta.json'
      - 'test/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install step on purpose. The harness stubs React, ReactDOM,
      # SheetJS and Chart.js itself, and the Python gates use only the standard
      # library, so CI cannot break on a registry outage or a transitive bump.

      - name: Every tab renders (no blank-page regressions)
        run: node test/deeprender.js index.html

      - name: No stale constants or prior-cycle labels
        run: python3 -I test/verify_stale.py index.html build_meta.json

      - name: Revenue timing reconciles across methods
        run: python3 -I test/verify_revtiming.py index.html build_meta.json

      - name: Summary
        if: always()
        run: |
          echo "### Scorecard CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "All three gates passed. Safe to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**A gate failed. Do not publish this build.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the failing step above; each gate prints the specific" >> "$GITHUB_STEP_SUMMARY"
            echo "assertion and the two figures that disagree." >> "$GITHUB_STEP_SUMMARY"
          fi
